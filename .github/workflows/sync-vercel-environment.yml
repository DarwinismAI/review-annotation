name: Sync Vercel environment

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  sync-vercel-environment:
    name: Sync Vercel production env (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sync Vercel production env (dev)
        if: inputs.target == 'dev'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DEV_PROJECT_ID }}
          DATABASE_URL_VALUE: ${{ secrets.DEV_DATABASE_URL }}
          POSTGRES_URL_VALUE: ${{ secrets.DEV_POSTGRES_URL }}
          NEXT_PUBLIC_APP_URL_VALUE: ${{ secrets.DEV_NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL_VALUE: ${{ secrets.DEV_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY_VALUE: ${{ secrets.DEV_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL_VALUE: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_ANON_KEY_VALUE: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY_VALUE: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY_VALUE: ${{ secrets.DEV_SUPABASE_SECRET_KEY }}
          SUPERADMIN_EMAILS_VALUE: ${{ secrets.DEV_SUPERADMIN_EMAILS }}
        run: bash scripts/sync-vercel-environment.sh

      - name: Sync Vercel production env (prod)
        if: inputs.target == 'prod'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID }}
          DATABASE_URL_VALUE: ${{ secrets.PROD_DATABASE_URL }}
          POSTGRES_URL_VALUE: ${{ secrets.PROD_POSTGRES_URL }}
          NEXT_PUBLIC_APP_URL_VALUE: ${{ secrets.PROD_NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL_VALUE: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY_VALUE: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL_VALUE: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_ANON_KEY_VALUE: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY_VALUE: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY_VALUE: ${{ secrets.PROD_SUPABASE_SECRET_KEY }}
          SUPERADMIN_EMAILS_VALUE: ${{ secrets.PROD_SUPERADMIN_EMAILS }}
        run: bash scripts/sync-vercel-environment.sh
