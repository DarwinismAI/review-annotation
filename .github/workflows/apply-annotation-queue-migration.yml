name: Apply annotation queue migration

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  apply-annotation-queue-migration:
    name: Apply annotation queue migration (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      TARGET: ${{ inputs.target }}
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      DEV_POSTGRES_URL: ${{ secrets.DEV_POSTGRES_URL }}
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      PROD_POSTGRES_URL: ${{ secrets.PROD_POSTGRES_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply annotation queue migration (${{ inputs.target }})
        shell: bash
        run: |
          set -euo pipefail

          if [ "$TARGET" = "dev" ]; then
            database_url="${DEV_DATABASE_URL:-${DEV_POSTGRES_URL:-}}"
          else
            database_url="${PROD_DATABASE_URL:-${PROD_POSTGRES_URL:-}}"
          fi

          if [ -z "$database_url" ]; then
            printf '%s\n' "::error::Required database secret is empty for target: $TARGET" >&2
            exit 1
          fi

          DATABASE_URL="$database_url" pnpm exec tsx scripts/apply-annotation-queue-migration.ts
