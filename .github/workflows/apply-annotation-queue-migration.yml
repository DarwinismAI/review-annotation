name: Apply annotation queue migration

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  apply-annotation-queue-migration:
    name: Apply annotation queue migration (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply annotation queue migration (dev)
        if: inputs.target == 'dev'
        shell: bash
        env:
          DATABASE_URL_SECRET: ${{ secrets.DEV_DATABASE_URL }}
          POSTGRES_URL_SECRET: ${{ secrets.DEV_POSTGRES_URL }}
        run: |
          set -euo pipefail

          database_url="${DATABASE_URL_SECRET:-${POSTGRES_URL_SECRET:-}}"

          if [ -z "$database_url" ]; then
            printf '%s\n' "::error::Required database secret is empty for target: dev" >&2
            exit 1
          fi

          DATABASE_URL="$database_url" pnpm exec tsx scripts/apply-annotation-queue-migration.ts

      - name: Apply annotation queue migration (prod)
        if: inputs.target == 'prod'
        shell: bash
        env:
          DATABASE_URL_SECRET: ${{ secrets.PROD_DATABASE_URL }}
          POSTGRES_URL_SECRET: ${{ secrets.PROD_POSTGRES_URL }}
        run: |
          set -euo pipefail

          database_url="${DATABASE_URL_SECRET:-${POSTGRES_URL_SECRET:-}}"

          if [ -z "$database_url" ]; then
            printf '%s\n' "::error::Required database secret is empty for target: prod" >&2
            exit 1
          fi

          DATABASE_URL="$database_url" pnpm exec tsx scripts/apply-annotation-queue-migration.ts
