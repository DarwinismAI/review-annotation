name: Apply annotation queue migration

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  apply-annotation-queue-migration:
    name: Apply annotation queue migration (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      DATABASE_URL: ${{ inputs.target == 'dev' && (secrets.DEV_DATABASE_URL || secrets.DEV_POSTGRES_URL) || (secrets.PROD_DATABASE_URL || secrets.DATABASE_URL || secrets.PROD_POSTGRES_URL || secrets.POSTGRES_URL) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply annotation queue migration (${{ inputs.target }})
        run: pnpm exec tsx scripts/apply-annotation-queue-migration.ts
